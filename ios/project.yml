# XcodeGen spec. `brew install xcodegen && xcodegen generate` in this
# directory writes MPLabel.xcodeproj.
#
# The project file is generated rather than committed on purpose: a
# .pbxproj is a wall of UUIDs that conflicts on every branch and cannot
# be reviewed, and this repo has one developer working from two machines.
# Twenty lines that can be read beats four hundred that cannot.

name: MPLabel
options:
  bundleIdPrefix: com.tyevco
  deploymentTarget:
    # DataScannerViewController is iOS 16. 17 is the floor anyway for
    # ContentUnavailableView and `.task(id:)` behaving as written.
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  MPLabel:
    type: application
    platform: iOS
    sources:
      - path: MPLabel
    info:
      path: MPLabel/Info.plist
      properties:
        CFBundleDisplayName: mplabel
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Required, and the string is shown to her verbatim the first
        # time the Scan tab opens. Say what it is for, not that the app
        # would like access.
        NSCameraUsageDescription:
          Reads the QR code on a printed label so you do not have to type
          the code underneath it.
        # No blanket ATS exception, in any configuration. The route in
        # is a tunnel with real TLS.
        #
        # Debug adds NSAllowsLocalNetworking below, and only that: it
        # permits http to the local network and nothing else, which is
        # what a UI test driving a Python server on 127.0.0.1 needs.
        # NSAllowsArbitraryLoads would permit the whole internet and has
        # a way of outliving the afternoon that justified it.
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"    # iPhone. There is no iPad layout.
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # Set these on the Mac, or in Xcode's Signing pane:
        # DEVELOPMENT_TEAM: XXXXXXXXXX
        CODE_SIGN_STYLE: Automatic
      configs:
        debug:
          # Local network only, and only in Debug. The release build
          # that goes on her phone has no exception at all, so a
          # plain-http address still fails there - which is the
          # behaviour worth keeping.
          INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES

  MPLabelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MPLabelTests
        excludes:
          - "Fixtures/**"
      # A folder reference, not a group: the tests look the JSON up by
      # name in the bundle, and flattening it into individual resources
      # would work until two fixtures ever shared a name.
      - path: MPLabelTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: MPLabel
    settings:
      base:
        # @testable import needs the app built without optimisation,
        # which is the default for Debug and worth stating for anyone
        # who changes the scheme.
        ENABLE_TESTABILITY: YES

  MPLabelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MPLabelUITests
    dependencies:
      - target: MPLabel
