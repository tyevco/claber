# XcodeGen spec. `brew install xcodegen && xcodegen generate` in this
# directory writes MPLabel.xcodeproj.
#
# The project file is generated rather than committed on purpose: a
# .pbxproj is a wall of UUIDs that conflicts on every branch and cannot
# be reviewed, and this repo has one developer working from two machines.
# Twenty lines that can be read beats four hundred that cannot.

name: MPLabel
options:
  bundleIdPrefix: com.tyevco
  deploymentTarget:
    # DataScannerViewController is iOS 16. 17 is the floor anyway for
    # ContentUnavailableView and `.task(id:)` behaving as written.
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  MPLabel:
    type: application
    platform: iOS
    sources:
      - path: MPLabel
    info:
      path: MPLabel/Info.plist
      properties:
        CFBundleDisplayName: mplabel
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Required, and the string is shown to her verbatim the first
        # time the Scan tab opens. Say what it is for, not that the app
        # would like access.
        NSCameraUsageDescription:
          Reads the QR code on a printed label so you do not have to type
          the code underneath it.
        # One ATS exception, and it is the narrow one.
        #
        # NSAllowsLocalNetworking permits http to unqualified names,
        # .local, and the private IP ranges - the local network and
        # nothing else. NSAllowsArbitraryLoads would permit the whole
        # internet and has a way of outliving the afternoon that
        # justified it, so it is not here in any configuration.
        #
        # It is not Debug-only, and that is a correction rather than a
        # choice: the first attempt set it as
        # INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking
        # in the debug config, and no such build setting exists.
        # INFOPLIST_KEY_* only handles top-level plist keys, and
        # NSAppTransportSecurity is a dictionary - so it would have been
        # silently ignored and the UI tests would have failed to reach
        # 127.0.0.1 with an error that looks nothing like its cause.
        #
        # What this does *not* do is let the app talk to a plain-http
        # host on the internet, which is the property worth keeping: a
        # tunnel hostname over http still fails.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"    # iPhone. There is no iPad layout.
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # Set these on the Mac, or in Xcode's Signing pane:
        # DEVELOPMENT_TEAM: XXXXXXXXXX
        CODE_SIGN_STYLE: Automatic

  MPLabelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MPLabelTests
        excludes:
          - "Fixtures/**"
      # A folder reference, not a group: the tests look the JSON up by
      # name in the bundle, and flattening it into individual resources
      # would work until two fixtures ever shared a name.
      - path: MPLabelTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: MPLabel
    settings:
      base:
        # @testable import needs the app built without optimisation,
        # which is the default for Debug and worth stating for anyone
        # who changes the scheme.
        ENABLE_TESTABILITY: YES
        # A test bundle is code-signed like anything else and so needs a
        # plist. The app target has an `info:` block that XcodeGen
        # generates one from; these do not, so Xcode generates theirs.
        # Without it the build fails at signing, not at compile, which
        # reads as a certificate problem and is not one.
        GENERATE_INFOPLIST_FILE: YES

  MPLabelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MPLabelUITests
    dependencies:
      - target: MPLabel
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
