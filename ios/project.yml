# XcodeGen spec. `brew install xcodegen && xcodegen generate` in this
# directory writes MPLabel.xcodeproj.
#
# The project file is generated rather than committed on purpose: a
# .pbxproj is a wall of UUIDs that conflicts on every branch and cannot
# be reviewed, and this repo has one developer working from two machines.
# Twenty lines that can be read beats four hundred that cannot.

name: MPLabel
options:
  bundleIdPrefix: com.tyevco
  deploymentTarget:
    # 26, deliberately, and it is a decision rather than drift.
    #
    # The old floor was 17 - DataScannerViewController is iOS 16, and 17
    # is where ContentUnavailableView and `.task(id:)` behave as written.
    # Nothing needed more than that until `FoundationModels`, which is
    # iOS 26 and is how a suggestion gets made on the phone rather than
    # by sending her photographs to somebody's API. Supporting 17 as well
    # would mean every one of those call sites carrying an `#available`
    # and a second path that cannot be tested on the only handset there
    # is, which is a worse trade than dropping OS versions she does not
    # run.
    #
    # Note the image half of that framework is **27**, not 26: passing a
    # photograph to the model still needs its own `#available` until the
    # floor moves again.
    iOS: "26.0"
  createIntermediateGroups: true

# Declared, not left to Xcode.
#
# Every command in this repo says `-scheme MPLabel`, and that worked
# only because Xcode had autocreated a scheme in `xcuserdata` on this
# machine once - which `xcodegen generate` then wiped, and which a fresh
# clone never had at all. The failure is `does not contain a scheme
# named "MPLabel"`, which reads like the project is broken rather than
# like a file nobody generated.
schemes:
  MPLabel:
    build:
      targets:
        MPLabel: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MPLabelTests
        - MPLabelUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  MPLabel:
    type: application
    platform: iOS
    sources:
      - path: MPLabel
    info:
      path: MPLabel/Info.plist
      properties:
        CFBundleDisplayName: mplabel
        UILaunchScreen: {}
        # Both indirected through build settings so that CI can override
        # them on the xcodebuild command line. XcodeGen's own defaults
        # are the literals "1.0" and "1", which App Store Connect
        # accepts exactly once: the second upload is rejected for a
        # duplicate build number, after the archive has been built and
        # signed. See `.github/workflows/ios-release.yml` for where the
        # real numbers come from.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # What code is actually in this build, the same question
        # `build.py` answers on the Pi - and the same answer when nobody
        # stamped it. A TestFlight build is the one artifact that
        # outlives the branch it came from, and "which commit was that?"
        # has no other source once the tag has moved on.
        MPLabelSourceRevision: "$(MPLABEL_SOURCE_REVISION)"
        # Declared here rather than answered by hand on every upload.
        # The app's own traffic is HTTPS and the Keychain, both of which
        # are exempt; there is no encryption in this repo that is not
        # the system's. Without the key every build stops in TestFlight
        # on "Missing Compliance" and waits for a form.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Required, and the string is shown to her verbatim the first
        # time the Scan tab opens. Say what it is for, not that the app
        # would like access.
        NSCameraUsageDescription:
          Reads the QR code on a printed label so you do not have to type
          the code underneath it.
        # One ATS exception, and it is the narrow one.
        #
        # NSAllowsLocalNetworking permits http to unqualified names,
        # .local, and the private IP ranges - the local network and
        # nothing else. NSAllowsArbitraryLoads would permit the whole
        # internet and has a way of outliving the afternoon that
        # justified it, so it is not here in any configuration.
        #
        # It is not Debug-only, and that is a correction rather than a
        # choice: the first attempt set it as
        # INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking
        # in the debug config, and no such build setting exists.
        # INFOPLIST_KEY_* only handles top-level plist keys, and
        # NSAppTransportSecurity is a dictionary - so it would have been
        # silently ignored and the UI tests would have failed to reach
        # 127.0.0.1 with an error that looks nothing like its cause.
        #
        # What this does *not* do is let the app talk to a plain-http
        # host on the internet, which is the property worth keeping: a
        # tunnel hostname over http still fails.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      # aps-environment, and nothing else. Push needs the capability on
      # the App ID as well - Xcode's Signing pane adds it, and without it
      # a *device* build fails at signing while the simulator carries on
      # working, which is a confusing way to find out.
      #
      # **The properties have to be here, not only in the file.**
      # XcodeGen *generates* what `path` points at, so an entitlement
      # written into that file by hand survives exactly until the next
      # `xcodegen generate` - which this repo tells you to run whenever a
      # file is added. It was hand-written once and would have been
      # silently deleted the next time anyone regenerated, taking push on
      # a real phone with it and leaving the simulator working.
      path: MPLabel/MPLabel.entitlements
      properties:
        # `development`, not `production`, deliberately: Xcode replaces
        # this with `production` when it re-signs during
        # `-exportArchive` for App Store distribution, so a TestFlight
        # build gets a production token and a build run from Xcode onto
        # the same handset gets a sandbox one. Writing `production` here
        # would break the second without helping the first.
        #
        # Which environment a token belongs to travels to the Pi with it
        # - see Push.swift. A sandbox token offered to the production
        # host comes back BadDeviceToken, which reads as malformed
        # rather than as addressed to the wrong Apple.
        aps-environment: development
    settings:
      base:
        # The real App ID, from the developer account - not derived from
        # `bundleIdPrefix`. `apns_topic` on the Pi must be this string
        # exactly, and the App ID that carries the push capability is
        # registered against it: a build whose identifier does not match
        # fails provisioning on a device while the simulator carries on
        # working.
        PRODUCT_BUNDLE_IDENTIFIER: com.marchvector.Sellomatic
        DEVELOPMENT_TEAM: 43FWY7NGK9
        # Defaults, and they are meant to look like defaults. A release
        # build overrides all three; a checkout says "checkout" for the
        # same reason `_build.py` does.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        MPLABEL_SOURCE_REVISION: checkout
        TARGETED_DEVICE_FAMILY: "1"    # iPhone. There is no iPad layout.
        # The *language mode*, not the compiler version. Valid values
        # are 4, 4.2, 5 and 6 - "5.9" is a compiler release and is not
        # one of them. Kept at 5 on purpose: Xcode 27 ships a Swift 6
        # compiler, and under mode 6 the concurrency diagnostics this
        # code has already hit twice become errors rather than warnings.
        # Moving to 6 is a deliberate piece of work, not a default.
        SWIFT_VERSION: "5"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # Set these on the Mac, or in Xcode's Signing pane:
        # DEVELOPMENT_TEAM: XXXXXXXXXX
        CODE_SIGN_STYLE: Automatic

  MPLabelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MPLabelTests
        excludes:
          - "Fixtures/**"
      # A folder reference, not a group: the tests look the JSON up by
      # name in the bundle, and flattening it into individual resources
      # would work until two fixtures ever shared a name.
      - path: MPLabelTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: MPLabel
    settings:
      base:
        # @testable import needs the app built without optimisation,
        # which is the default for Debug and worth stating for anyone
        # who changes the scheme.
        ENABLE_TESTABILITY: YES
        # A test bundle is code-signed like anything else and so needs a
        # plist. The app target has an `info:` block that XcodeGen
        # generates one from; these do not, so Xcode generates theirs.
        # Without it the build fails at signing, not at compile, which
        # reads as a certificate problem and is not one.
        GENERATE_INFOPLIST_FILE: YES

  MPLabelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MPLabelUITests
    dependencies:
      - target: MPLabel
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
