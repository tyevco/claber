[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mplabel"
version = "0.1.0"
description = "Facebook Marketplace shipping-label printer and sales/listings tracker for Raspberry Pi"
requires-python = ">=3.9"
# Upper bounds mirror requirements.txt - see the note there. pypdf 7 is
# the one that matters: it removes the page-merge path stamp_code depends
# on, and nothing about that failure would announce itself.
dependencies = [
    "pypdf>=5.0,<7",
    "pdfplumber>=0.11,<1.0",
    "pypdfium2>=4.0,<6",
    # 10.1 for ImageFont.load_default(size=...), which is what draws the
    # inventory label. Earlier versions have only the fixed 11px bitmap
    # face, which is unreadable at 48mm.
    "Pillow>=10.1,<14",
]

[project.optional-dependencies]
sheets = ["gspread>=6.0", "google-auth>=2.0"]
dev = ["pytest>=8.0", "reportlab>=4.0"]

[project.scripts]
mplabel = "mplabel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# install_pi.sh does a non-editable install, so anything not declared here
# simply is not on the Pi - the app would serve 404s for its own frontend
# while working perfectly from a git checkout.
[tool.setuptools.package-data]
mplabel = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
