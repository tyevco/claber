[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mplabel"
version = "0.1.0"
description = "Facebook Marketplace shipping-label printer and sales/listings tracker for Raspberry Pi"
requires-python = ">=3.9"
dependencies = [
    "pypdf>=5.0",
    "pdfplumber>=0.11",
    "pypdfium2>=4.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
sheets = ["gspread>=6.0", "google-auth>=2.0"]
dev = ["pytest>=8.0", "reportlab>=4.0"]

[project.scripts]
mplabel = "mplabel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
